<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Реклама — Telepat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1a1a1a; }
  .top-bar .title { font-size: 15px; font-weight: 600; }
  .top-bar .counter { font-size: 13px; color: #888; }
  .progress-bar { height: 4px; background: #222; width: 100%; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #4fc3f7, #29b6f6); width: 0%; transition: width 0.25s ease; }
  .video-wrap { position: relative; width: 100%; height: 55vh; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .click-overlay { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; text-decoration: none; cursor: pointer; z-index: 5; }
  .cta-badge { background: rgba(0, 0, 0, 0.85); color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 15px; font-weight: 600; border: 2px solid #4fc3f7; animation: pulse 1.6s infinite; box-shadow: 0 4px 20px rgba(79, 195, 247, 0.4); }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .info { padding: 20px; text-align: center; }
  .info .ad-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .info .ad-desc { font-size: 14px; color: #999; margin-bottom: 16px; }
  .info .ad-reward { font-size: 14px; color: #4fc3f7; margin-bottom: 20px; }
  .info .ad-reward b { color: #fff; font-size: 16px; }
  .claim-btn { width: 100%; max-width: 340px; margin: 0 auto; display: block; padding: 16px; background: linear-gradient(135deg, #4fc3f7, #29b6f6); border: none; border-radius: 14px; font-size: 17px; font-weight: 700; color: #000; opacity: 0.35; pointer-events: none; transition: opacity 0.3s; }
  .claim-btn.ready { opacity: 1; pointer-events: auto; box-shadow: 0 6px 20px rgba(79, 195, 247, 0.5); }
  .claim-btn:active { transform: scale(0.97); }
  .status { margin-top: 14px; font-size: 13px; color: #666; min-height: 18px; }
  .status.error { color: #ff5252; }
  .status.success { color: #4caf50; }
  .fireworks { position: fixed; inset: 0; pointer-events: none; display: none; align-items: center; justify-content: center; z-index: 100; background: rgba(0,0,0,0.5); }
  .fireworks.show { display: flex; }
  .reward-popup { background: rgba(0, 0, 0, 0.9); border: 3px solid #ffd700; border-radius: 24px; padding: 30px 40px; text-align: center; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes popIn { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .reward-popup .emoji { font-size: 64px; margin-bottom: 10px; }
  .reward-popup .amount { font-size: 32px; font-weight: 800; color: #ffd700; text-shadow: 0 0 20px rgba(255, 215, 0, 0.7); }
  .reward-popup .label { font-size: 14px; color: #999; margin-top: 8px; }
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; }
  .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 30px; text-align: center; }
  .error-screen .icon { font-size: 64px; margin-bottom: 16px; }
  .error-screen .msg { font-size: 16px; color: #ccc; margin-bottom: 8px; }
  .error-screen .sub { font-size: 13px; color: #666; margin-bottom: 24px; }
  .error-screen button { padding: 14px 30px; background: #4fc3f7; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; color: #000; }
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div style="color:#888;font-size:14px;">Загружаем рекламу...</div>
</div>

<div id="errorScreen" class="error-screen" style="display:none;">
  <div class="icon" id="errIcon">⏳</div>
  <div class="msg" id="errMsg">Подождите</div>
  <div class="sub" id="errSub"></div>
  <button onclick="loadAd()">Обновить</button>
</div>

<div id="main" style="display:none;">
  <div class="top-bar">
    <div class="title" id="adTitle">Реклама</div>
    <div class="counter" id="counter">0 / 150</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="video-wrap">
    <video id="adVideo" playsinline webkit-playsinline preload="auto"></video>
    <a id="ctaOverlay" href="#" target="_blank" class="click-overlay">
      <div class="cta-badge" id="ctaBadge">👉 Подробнее</div>
    </a>
  </div>
  <div class="info">
    <div class="ad-title" id="adTitle2">—</div>
    <div class="ad-desc" id="adDesc">—</div>
    <div class="ad-reward">Награда за просмотр: <b id="adReward">$0.00015</b></div>
    <button class="claim-btn" id="claimBtn" onclick="claimReward()">
      Смотрите видео до конца
    </button>
    <div class="status" id="status"></div>
  </div>
</div>

<div id="fireworks" class="fireworks">
  <div class="reward-popup">
    <div class="emoji">💰</div>
    <div class="amount" id="rewardAmount">+$0.00015</div>
    <div class="label">Зачислено на баланс!</div>
  </div>
</div>

<audio id="coinSound" preload="auto">
  <source src="https://actions.google.com/sounds/v1/cartoon/coins.ogg" type="audio/ogg">
  <source src="https://actions.google.com/sounds/v1/cartoon/coins.mp3" type="audio/mpeg">
</audio>

<script>
const SUPABASE_URL = 'https://jutszxuzjzyfxarceydw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_geRczpRc3faUHRGto2ue7A_eFFiJDwO';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const tg = window.Telegram.WebApp;

let currentCampaign = null;
let rewardClaimed = false;

tg.ready();
tg.expand();
try {
  tg.setHeaderColor('#0f0f0f');
  tg.setBackgroundColor('#0f0f0f');
} catch(e) {}

function showLoading() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('main').style.display = 'none';
  document.getElementById('errorScreen').style.display = 'none';
}

function showError(icon, msg, sub) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display = 'none';
  document.getElementById('errorScreen').style.display = 'flex';
  document.getElementById('errIcon').textContent = icon;
  document.getElementById('errMsg').textContent = msg;
  document.getElementById('errSub').textContent = sub || '';
}

function showMain() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('errorScreen').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}

async function loadAd() {
  showLoading();
  try {
    const userId = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
    if (!userId) {
      showError('⚠️', 'Не удалось получить ваш ID', 'Откройте через Telegram-бота');
      return;
    }

    const { data, error } = await supabase.rpc('get_active_ad', {
      p_telegram_id: userId
    });

    if (error) throw error;

    if (!data.ok) {
      if (data.reason === 'daily_limit') {
        showError('✅', 'Дневной лимит исчерпан',
          'Вы посмотрели ' + data.views_today + ' из ' + data.daily_limit + '. Возвращайтесь завтра!');
      } else if (data.reason === 'cooldown') {
        showError('⏳', 'Подождите ' + data.wait_seconds + ' сек.', 'Кулдаун между просмотрами');
        setTimeout(loadAd, (data.wait_seconds + 1) * 1000);
      } else if (data.reason === 'no_ads') {
        showError('📭', 'Реклама временно недоступна', 'Заходите позже');
      } else {
        showError('⚠️', 'Не удалось загрузить', JSON.stringify(data));
      }
      return;
    }

    currentCampaign = data.campaign;
    setupAd(data);
    showMain();
  } catch (err) {
    console.error(err);
    showError('⚠️', 'Ошибка соединения', err.message);
  }
}

function setupAd(data) {
  const c = data.campaign;
  document.getElementById('adTitle').textContent = c.title;
  document.getElementById('adTitle2').textContent = c.title;
  document.getElementById('adDesc').textContent = c.description || '';
  document.getElementById('adReward').textContent = '$' + Number(c.reward).toFixed(5);
  document.getElementById('counter').textContent = data.views_today + ' / ' + data.daily_limit;

  const video = document.getElementById('adVideo');
  video.src = c.video_url;
  video.load();

  document.getElementById('ctaOverlay').href = c.cta_url;
  document.getElementById('ctaBadge').textContent = c.cta_button_text || '👉 Подробнее';

  video.addEventListener('timeupdate', function() {
    if (video.duration) {
      const pct = (video.currentTime / video.duration) * 100;
      document.getElementById('progressFill').style.width = pct + '%';
    }
  });

  video.addEventListener('ended', function() {
    const btn = document.getElementById('claimBtn');
    btn.classList.add('ready');
    btn.textContent = '🎁 Получить бонус';
    document.getElementById('status').textContent = 'Видео просмотрено! Нажмите, чтобы получить награду';
  });

  video.play().catch(function() {
    video.muted = true;
    video.play().catch(function(e) { console.log('autoplay failed', e); });
  });
}

async function claimReward() {
  if (rewardClaimed || !currentCampaign) return;
  rewardClaimed = true;

  const btn = document.getElementById('claimBtn');
  btn.disabled = true;
  btn.textContent = 'Начисляем...';
  document.getElementById('status').textContent = '';

  try {
    const userId = tg.initDataUnsafe.user.id;
    const { data, error } = await supabase.rpc('claim_ad_reward', {
      p_telegram_id: userId,
      p_campaign_id: currentCampaign.id
    });

    if (error) throw error;

    if (!data.ok) {
      btn.classList.remove('ready');
      btn.textContent = '❌ ' + (data.error || 'Ошибка');
      document.getElementById('status').textContent = data.error || '';
      document.getElementById('status').className = 'status error';
      rewardClaimed = false;
      return;
    }

    showRewardAnimation(data.reward, data.new_balance);
  } catch (err) {
    console.error(err);
    btn.textContent = '❌ Ошибка';
    document.getElementById('status').textContent = err.message;
    document.getElementById('status').className = 'status error';
    rewardClaimed = false;
  }
}

function showRewardAnimation(reward, newBalance) {
  try {
    const sound = document.getElementById('coinSound');
    sound.volume = 0.5;
    sound.play().catch(function(e) { console.log('sound blocked', e); });
  } catch(e) {}

  document.getElementById('rewardAmount').textContent = '+' + Number(reward).toFixed(5) + ' TG';
  document.getElementById('fireworks').classList.add('show');

  if (tg.HapticFeedback) {
    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
  }

  setTimeout(function() {
    document.getElementById('fireworks').classList.remove('show');
    tg.close();
  }, 3500);
}

loadAd();
</script>
</body>
</html>
